name: Jays
description: >-
  JAYS is a Swedish consumer audio brand founded in 2006 by Jens and Johan,
  headquartered in Sweden and owned by the Northbaze Group AB. It designs and
  sells wireless and wired headphones, true-wireless earbuds, Bluetooth and
  multiroom speakers, and audio accessories, sold direct-to-consumer through a
  Shopify storefront at jaysheadphones.com. JAYS publishes no first-party
  developer API; its only machine-accessible surface is the Shopify-provided
  agent-commerce layer: a Universal Commerce Protocol (UCP) merchant profile
  with a hosted MCP shopping endpoint, Customer Account OpenID Connect / OAuth
  discovery documents, and an llms.txt. This profile was surfaced as a Creandum
  portfolio/commitment lead and enriched by the API Evangelist pipeline.
